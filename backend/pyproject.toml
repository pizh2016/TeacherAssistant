[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "classroom-horn-backend"
version = "0.2.0"
description = "Classroom Horn Backend - FastAPI server with WebSocket real-time communication"
requires-python = ">=3.10"
dependencies = [
    # Core framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "starlette>=0.37.0",
    "websockets>=12.0",
    "python-multipart>=0.0.9",

    # Database and ORM (sync SQLAlchemy + SQLite/WAL; no aiosqlite needed)
    "sqlalchemy>=2.0",
    "alembic>=1.13",

    # Authentication (JWT only; MVP uses pairing-code login, no password hashing)
    "python-jose[cryptography]>=3.3",

    # Configuration
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",

    # Scheduler (Phase 2: timed/periodic broadcasts)
    "APScheduler>=3.10,<4.0",

    # Text-to-Speech (optional)
    "pyttsx3>=2.90",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

build = [
    "build>=1.2",
    "twine>=5.0",
]

[project.scripts]
classroom-horn = "horn.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
